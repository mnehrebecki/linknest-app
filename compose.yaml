services:
  frontend:
    image: linknest-frontend
    build: 
      context: frontend/
    ports:
      - "80:80"
    networks:
      - linknest
    restart: unless-stopped
    depends_on:
      backend: 
        condition: service_healthy

  backend:
    image: linknest-backend
    build: 
      context: backend/
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}"
    networks:
      - linknest
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: unless-stopped
    volumes:
      - database-data:/var/lib/postgresql/data
    networks:
      - linknest

volumes:
  database-data:

networks:
  linknest:
    driver: bridge