apiVersion: v1
kind: Service
metadata:
  labels:
    app: linknest-frontend
  name: linknest-frontend
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - port: {{ .Values.frontend.service.port }}
    protocol: TCP
    targetPort: 80
  selector:
    app: linknest-frontend
  type: {{ .Values.frontend.service.type }}
